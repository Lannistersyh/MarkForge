name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless pillow pytest

      - name: Run tests (OCR/browser backends absent, graceful skip)
        run: python -m pytest tests/ -v --tb=short

      - name: Sanity-check CLI on a synthetic UI
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (600, 400), 'white')
          d = ImageDraw.Draw(img)
          d.rectangle([100, 50, 300, 150], fill=(23, 105, 224))
          d.rectangle([350, 50, 550, 150], fill=(24, 121, 78))
          img.save('ci-synthetic.png')
          "
          python3 -m markforge.cli --ocr none ground ci-synthetic.png "color:#1769e0" | tee cli-out.json
          python3 -c "
          import json
          out = open('cli-out.json').read()
          payload = json.loads(out[out.rfind('===JSON===') + 10:].strip().splitlines()[0])
          assert payload['status'] == 'GROUNDED', payload
          cx, cy = payload['chosen']['centroid']
          assert 100 <= cx <= 300 and 50 <= cy <= 150, payload['chosen']['centroid']
          print('CI sanity: GROUNDED at', (cx, cy))
          "
